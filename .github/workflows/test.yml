name: Test

on:
  pull_request:
    branches:
      - main
      - louis/fe-revision
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Check i18n regressions
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^frontend/src/i18n/'; then
            ./scripts/check-i18n.sh
          else
            echo "Skipping i18n regressions check (no i18n files changed)."
          fi

      - name: Format check frontend
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '^frontend/src/.*\\.(ts|tsx|js|jsx|json|css|md)$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "Skipping format check (no matching frontend source changes)."
            exit 0
          fi
          cd frontend
          echo "$CHANGED" | sed 's#^frontend/##' | xargs npx prettier --check

      - name: Type check frontend
        run: cd frontend && npx tsc --noEmit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-04
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        env:
          RUST_CACHE_DEBUG: true
        with:
          workspaces: "."
          cache-provider: "buildjet"
          cache-on-failure: true
          shared-key: "shared"
          cache-all-crates: true

      - name: Install sqlx-cli
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: sqlx-cli
          no-default-features: true
          features: sqlite,postgres

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Checks
        run: |
          cargo fmt --all -- --check
          npm run generate-types:check
          npm run prepare-db:check
          npm run remote:prepare-db:check
          cargo test --workspace
          cargo clippy --all --all-targets -- -D warnings  
