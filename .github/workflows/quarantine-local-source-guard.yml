# PR-16 enforcement promotion note:
# Enforced-default mode enabled on 2026-02-19 after stable window since PR-15 merge (ded4253...).
# Stable-window evidence must be referenced in the PR-16 description.
name: Quarantine Local Source Guard

on:
  pull_request:
    paths:
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "frontend/src/config/quarantine.ts"
      - "frontend/src/config/quarantineFallbackDefaults.json"
      - "scripts/check-quarantine-local-source.js"
      - "scripts/test-check-quarantine-local-source.js"
      - "scripts/test-quarantine-deprecation-contract.js"
      - ".github/workflows/quarantine-local-source-guard.yml"
  workflow_dispatch:
    inputs:
      alert_only:
        description: "Break-glass: run alert-only mode (non-blocking)"
        required: false
        default: false
        type: boolean

jobs:
  guard:
    name: Quarantine Local Source Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Resolve execution mode
        id: mode
        shell: bash
        run: |
          mode="forbidden"
          mode_reason="enforced_default"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.alert_only }}" == "true" ]]; then
            mode="alert"
            mode_reason="break_glass_alert_only"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode_reason=$mode_reason" >> "$GITHUB_OUTPUT"

      - name: Run quarantine local-source guard
        id: guard
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          node scripts/check-quarantine-local-source.js \
            --mode "${{ steps.mode.outputs.mode }}" \
            --receipt-out artifacts/quarantine_local_source_guard_receipt.json \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW"
          rc=$?
          echo "guard_exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "::notice::Guard mode=${{ steps.mode.outputs.mode }} reason=${{ steps.mode.outputs.mode_reason }} exit_code=$rc"
          node - <<'NODE'
          const fs = require('node:fs');

          const receiptPath = 'artifacts/quarantine_local_source_guard_receipt.json';
          let status = 'receipt_missing';
          let usageCount = 0;

          if (fs.existsSync(receiptPath)) {
            try {
              const raw = fs.readFileSync(receiptPath, 'utf8');
              const payload = JSON.parse(raw);
              status = String(payload.status || 'unknown');
              usageCount = Number(payload.usage_count || 0);
            } catch (_err) {
              status = 'receipt_invalid';
              usageCount = 0;
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `usage_count=${usageCount}\n`, 'utf8');

          if (status !== 'clean') {
            process.stdout.write(`::warning::Quarantine local-source guard status=${status}, usage_count=${usageCount}\n`);
          }
          NODE

      - name: Run guard contract tests
        run: |
          node --test scripts/test-check-quarantine-local-source.js scripts/test-quarantine-deprecation-contract.js

      - name: Pre-upload secret scan
        id: preupload_secret_scan_1
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_PATH="artifacts/quarantine_local_source_guard_receipt.json"
          if [ "$ARTIFACT_PATH" = "|" ] || [ "$ARTIFACT_PATH" = ">" ]; then
            echo "Artifact path uses multiline YAML scalar; skipping secret scan."
            exit 0
          fi
          shopt -s nullglob
          matches=( $ARTIFACT_PATH )
          if [ ${#matches[@]} -eq 0 ]; then
            echo "Artifact path '$ARTIFACT_PATH' not found; skipping secret scan."
            exit 0
          fi
          if ! command -v gitleaks >/dev/null 2>&1; then
            BIN_DIR="$HOME/.local/bin"
            mkdir -p "$BIN_DIR"
            if [ -n "${GITHUB_PATH:-}" ]; then
              echo "$BIN_DIR" >> "$GITHUB_PATH"
            fi
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$tmp_dir/gitleaks.tgz"
            tar -xzf "$tmp_dir/gitleaks.tgz" -C "$tmp_dir"
            install -m 0755 "$tmp_dir/gitleaks" "$BIN_DIR/gitleaks"
            export PATH="$BIN_DIR:$PATH"
          fi
          for source_path in "${matches[@]}"; do
            gitleaks detect --no-git --source "$source_path" --redact --exit-code 1
          done
      - name: Upload guard artifacts
        if: ${{ always() && steps.preupload_secret_scan_1.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-local-source-guard-${{ steps.mode.outputs.mode }}
          path: artifacts/quarantine_local_source_guard_receipt.json

      - name: Apply gate result
        if: always()
        shell: bash
        run: |
          mode="${{ steps.mode.outputs.mode }}"
          rc="${{ steps.guard.outputs.guard_exit_code }}"
          if [ "$mode" = "alert" ]; then
            echo "::warning::Break-glass alert_only=true active; forcing non-blocking outcome."
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "quarantine_local_source_guard_status=${{ steps.guard.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "quarantine_local_source_usage_count=${{ steps.guard.outputs.usage_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "quarantine_local_source_guard_exit_code=${{ steps.guard.outputs.guard_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=${{ steps.mode.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "mode_reason=${{ steps.mode.outputs.mode_reason }}" >> "$GITHUB_STEP_SUMMARY"
