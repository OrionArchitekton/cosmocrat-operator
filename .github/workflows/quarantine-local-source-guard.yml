name: Quarantine Local Source Guard

on:
  pull_request:
    paths:
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "frontend/src/config/quarantine.ts"
      - "frontend/src/config/quarantineFallbackDefaults.json"
      - "scripts/check-quarantine-local-source.js"
      - "scripts/test-check-quarantine-local-source.js"
      - "scripts/test-quarantine-deprecation-contract.js"
      - ".github/workflows/quarantine-local-source-guard.yml"
  workflow_dispatch:
    inputs:
      enforced_mode:
        description: "Run enforced preview mode (forbidden local source)"
        required: false
        default: false
        type: boolean

jobs:
  alert:
    name: Alert Mode (Non-Blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run quarantine local-source guard (alert)
        id: guard
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          node scripts/check-quarantine-local-source.js \
            --mode alert \
            --receipt-out artifacts/quarantine_local_source_guard_receipt.json \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW"
          rc=$?
          echo "guard_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Local-source guard exited non-zero in alert mode (non-blocking)."
          fi
          node - <<'NODE'
          const fs = require('node:fs');

          const raw = fs.readFileSync('artifacts/quarantine_local_source_guard_receipt.json', 'utf8');
          const payload = JSON.parse(raw);
          const status = String(payload.status || 'unknown');
          const usageCount = Number(payload.usage_count || 0);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `usage_count=${usageCount}\n`, 'utf8');

          if (status !== 'clean') {
            process.stdout.write(`::warning::Quarantine local-source guard status=${status}, usage_count=${usageCount}\n`);
          }
          NODE
          exit 0

      - name: Run guard contract tests
        run: |
          node --test scripts/test-check-quarantine-local-source.js scripts/test-quarantine-deprecation-contract.js

      - name: Upload guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-local-source-guard-alert
          path: artifacts/quarantine_local_source_guard_receipt.json

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "quarantine_local_source_guard_status=${{ steps.guard.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "quarantine_local_source_usage_count=${{ steps.guard.outputs.usage_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "quarantine_local_source_guard_exit_code=${{ steps.guard.outputs.guard_exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=alert (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  enforced-preview:
    name: Enforced Preview (Opt-In)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enforced_mode == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run quarantine local-source guard (forbidden)
        shell: bash
        env:
          QUARANTINE_LOCAL_SOURCE: forbidden
        run: |
          mkdir -p artifacts
          node scripts/check-quarantine-local-source.js \
            --mode forbidden \
            --receipt-out artifacts/quarantine_local_source_guard_receipt.json \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW"

      - name: Run guard contract tests
        run: |
          node --test scripts/test-check-quarantine-local-source.js scripts/test-quarantine-deprecation-contract.js

      - name: Upload guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-local-source-guard-enforced-preview
          path: artifacts/quarantine_local_source_guard_receipt.json
