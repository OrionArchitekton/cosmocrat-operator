name: secret-scan

on:
  pull_request:
    branches: [main, cosmocrat]
  push:
    branches: [main, cosmocrat]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (PR/push workspace)
        if: github.event_name != "schedule"
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-git --source . --redact

      - name: Secret scan (nightly git history)
        if: github.event_name == "schedule"
        uses: gitleaks/gitleaks-action@v2
        with:
          args: git --redact --log-opts="--all"
