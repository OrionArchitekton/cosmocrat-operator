name: secret-scan

on:
  pull_request:
    branches: [main, cosmocrat]
  push:
    branches: [main, cosmocrat]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin v8.24.3
          fi

      - name: Secret scan (pull request range)
        if: github.event_name == "pull_request"
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --exit-code 1 --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Secret scan (push range)
        if: github.event_name == "push"
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --exit-code 1 --log-opts="${{ github.event.before }}..${{ github.sha }}"

      - name: Secret scan (nightly full history)
        if: github.event_name == "schedule"
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --exit-code 1 --log-opts="--all"

      - name: Secret scan (manual latest commit)
        if: github.event_name == "workflow_dispatch"
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --exit-code 1 --log-opts="-1"
