name: secret-scan

on:
  pull_request:
    branches: [main, cosmocrat]
  push:
    branches: [main, cosmocrat, "codex/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            BIN_DIR="$HOME/.local/bin"
            mkdir -p "$BIN_DIR"
            if [ -n "${GITHUB_PATH:-}" ]; then
              echo "$BIN_DIR" >> "$GITHUB_PATH"
            fi
            tmp_dir="$(mktemp -d)"
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$tmp_dir/gitleaks.tgz"
            tar -xzf "$tmp_dir/gitleaks.tgz" -C "$tmp_dir"
            install -m 0755 "$tmp_dir/gitleaks" "$BIN_DIR/gitleaks"
            export PATH="$BIN_DIR:$PATH"
          fi

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          event_name="${GITHUB_EVENT_NAME}"
          if [ "$event_name" = "schedule" ]; then
            gitleaks git --redact --exit-code 1 --log-opts="--all"
            exit 0
          fi

          before_sha="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          pr_base_sha="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
          if [ -n "$pr_base_sha" ]; then
            log_range="${pr_base_sha}..${GITHUB_SHA}"
          elif [ -n "$before_sha" ] && [ "$before_sha" != "0000000000000000000000000000000000000000" ]; then
            log_range="${before_sha}..${GITHUB_SHA}"
          else
            log_range="-1"
          fi

          gitleaks git --redact --exit-code 1 --log-opts="$log_range"
